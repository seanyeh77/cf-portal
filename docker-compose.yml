services:
  portal:
    build: .
    image: cf-portal:latest
    env_file: .env
    ports:
      # Host address and port, set PORTAL_BIND / PORTAL_PORT in .env.
      - "${PORTAL_BIND:-0.0.0.0}:${PORTAL_PORT:-8080}:8080"
    volumes:
      - portal-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/portal", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  portal-data:
